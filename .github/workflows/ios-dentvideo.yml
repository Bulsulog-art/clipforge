name: iOS DentVideo

# Builds the DentVideo iPhone app and runs its tests on one macOS runner.
# Only on demand (Actions -> iOS DentVideo -> Run workflow, or `gh workflow run`).
# Owner decision 2026-11-17: no automatic runs on pull requests. Every run on a
# work-in-progress branch emailed the owner a failure; run it when the app is
# ready to be checked, before a TestFlight build (see CLAUDE.md, release gate).
on:
  workflow_dispatch:
    inputs:
      screens:
        description: "Simulator screenshots of every screen (demo mode): full, medium, quick, iap (sign-up and purchase, en + tr), requests (logo preview, topic, change, subtitles: en + tr) or none"
        type: choice
        options: [full, medium, quick, iap, requests, none]
        default: full
      tests:
        description: "Unit + end-to-end UI tests on iPhone 17 Pro Max (iOS 26), iPad Pro 13\" (iOS 26), iPhone SE 3rd gen (iOS 18)"
        type: boolean
        default: true

concurrency:
  group: ios-dentvideo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/DentVideo
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            ios/DentVideo/Core/.build
            ~/Library/Developer/Xcode/DerivedData/DentVideo-*/SourcePackages
          key: dv-spm-${{ runner.os }}-${{ hashFiles('ios/DentVideo/Core/Package.swift', 'ios/DentVideo/Core/Sources/**', 'ios/DentVideo/Core/Tests/**') }}
          restore-keys: dv-spm-${{ runner.os }}-

      - name: Core unit tests (swift test)
        working-directory: ios/DentVideo/Core
        run: swift test --parallel

      - name: Install XcodeGen
        # Runs even when the Core tests failed, so one run reports both.
        if: success() || failure()
        run: brew install xcodegen

      - name: Generate project
        if: success() || failure()
        run: xcodegen generate

      - name: Build app for the simulator (no signing)
        if: success() || failure()
        run: |
          mkdir -p build
          xcodebuild build \
            -project DentVideo.xcodeproj \
            -scheme DentVideo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*(concurrency|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Build Release and check no demo data ships
        if: success() || failure()
        env:
          # A dummy key through the same path the release workflow uses for the real one
          # (scripts/revenuecat_key.sh), so every run proves the key reaches a Release build.
          REVENUECAT_PUBLIC_KEY: appl_CIDummyKeyNotARealKey
        run: |
          ./scripts/revenuecat_key.sh write
          xcodebuild build \
            -project DentVideo.xcodeproj \
            -scheme DentVideo \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedDataRelease \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-release.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild-release.log
          BIN=$(find build/DerivedDataRelease/Build/Products -path "*Release-iphonesimulator/DentVideo.app/DentVideo" | head -1)
          # The demo mode (App/Sources/Demo) is DEBUG-only: its clinic, texts and launch switch must not be in Release.
          for w in "Demo Zahnarztpraxis" "sample.example" "DVScreen" "demo.invalid" "DemoTransport"; do
            if strings -a "$BIN" | grep -q "$w"; then echo "::error::Release binary contains demo data: $w"; exit 1; fi
          done
          echo "Release build has no demo data."
          ./scripts/revenuecat_key.sh check "$(dirname "$BIN")"
          rm -f Config/RevenueCat.xcconfig

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/DentVideo/build/xcodebuild.log
          retention-days: 7

  # Every screen and state in the simulator (DEBUG demo mode: fake in-process API, fictional
  # clinic), iPhone 6.9" in eight languages light/dark, largest text size, iPad 13". Only on demand.
  screens:
    if: github.event_name == 'workflow_dispatch' && inputs.screens != 'none'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/DentVideo
    steps:
      - uses: actions/checkout@v4

      - name: Xcode (newest installed) and simulators
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=/Applications/Xcode_16.4.app
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -E "iPhone 1[67] Pro Max|iPad Pro 13" || true

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ios/DentVideo/build/DerivedData
          key: dv-screens-dd-${{ runner.os }}-${{ hashFiles('ios/DentVideo/App/**', 'ios/DentVideo/Core/Sources/**', 'ios/DentVideo/project.yml') }}
          restore-keys: dv-screens-dd-${{ runner.os }}-

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Screenshots
        env:
          SCREENS_SET: ${{ inputs.screens }}
        run: ./scripts/screens.sh build/screens

      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dentvideo-screens-review
          path: ios/DentVideo/build/screens/review
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload App Store size screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dentvideo-screens-store
          path: ios/DentVideo/build/screens/store
          retention-days: 14
          if-no-files-found: ignore

  # Unit tests of the app's models and end-to-end UI journeys (demo flow mode: in-process fake
  # API), on the newest iPhone and iPad (iOS 26) and on the smallest iPhone with the oldest supported
  # iOS (iPhone SE 3rd gen, iOS 18; the app needs iOS 18). Only on demand.
  tests:
    if: github.event_name == 'workflow_dispatch' && inputs.tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: iphone-17-pro-max-ios26
            runner: macos-15
            xcode: "26"
            device: "iPhone 17 Pro Max"
            ios: "26"
          - leg: ipad-pro-13-ios26
            runner: macos-15
            xcode: "26"
            device: "iPad Pro 13-inch (M5)"
            ios: "26"
          - leg: iphone-se-3-ios18
            runner: macos-15
            xcode: "16.4"
            device: "iPhone SE (3rd generation)"
            ios: "18"
    name: tests (${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ios/DentVideo
    steps:
      - uses: actions/checkout@v4

      - name: Xcode ${{ matrix.xcode }}
        run: |
          X=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$X" ] || { ls /Applications | grep Xcode; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: iOS ${{ matrix.ios }} simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q "iOS ${{ matrix.ios }}\."; then exit 0; fi
          # Not preinstalled on this image: download it once for this job (several GB).
          for v in 18.6 18.5 18.4; do
            xcodebuild -downloadPlatform iOS -buildVersion "$v" && break
          done
          xcrun simctl list runtimes

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Unit and UI tests
        run: ./scripts/test.sh "${{ matrix.device }}" "${{ matrix.ios }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dentvideo-tests-${{ matrix.leg }}
          path: |
            ios/DentVideo/build/test.log
            ios/DentVideo/build/Tests.xcresult
          retention-days: 10
          if-no-files-found: ignore
