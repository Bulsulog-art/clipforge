name: DentVideo
options:
  bundleIdPrefix: com.bulsulabs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.55.6"

targets:
  DentVideo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - DentVideo
    info:
      path: DentVideo/Info.plist
      properties:
        CFBundleDisplayName: DentVideo
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleLocalizations: [en, tr, de, es]
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Saving an approved video to Photos only adds; the app never reads the library.
        NSPhotoLibraryAddUsageDescription: "DentVideo saves the videos you approve to your Photos so you can post them from your clinic's accounts."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bulsulabs.dentvideo
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: "YA6Y85MSY6"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: Supabase
    preBuildScripts:
      - name: Check config
        script: |
          if [ ! -f "$SRCROOT/DentVideo/Config.swift" ]; then
            echo "error: DentVideo/Config.swift is missing. Run scripts/make-config.sh (reads ~/.config/dentvideo/ios-public.env)."
            exit 1
          fi
        basedOnDependencyAnalysis: false

  DentVideoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DentVideoTests]
    dependencies:
      - target: DentVideo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DentVideo.app/DentVideo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DentVideoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DentVideoUITests]
    dependencies:
      - target: DentVideo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DentVideo

schemes:
  DentVideo:
    build:
      targets:
        DentVideo: all
    test:
      targets: [DentVideoTests, DentVideoUITests]
