# DentVideo iPhone app. Generate the Xcode project with XcodeGen (brew install xcodegen):
#   cd ios/DentVideo && xcodegen generate && open DentVideo.xcodeproj
# The generated project is not committed (.gitignore). Business logic lives in the local Swift
# package ./Core (`swift test` there runs its tests on macOS and Linux).
name: DentVideo
options:
  bundleIdPrefix: com.bulsulabs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  DentVideoCore:
    path: Core

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  DentVideo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DentVideo
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        # The eight interface languages; the strings are in App/Resources/*.xcstrings.
        CFBundleLocalizations: [en, de, es, tr, fr, ja, ar, pl]
        UILaunchScreen:
          UIColorName: Paper
          UIImageName: Mark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        # No background modes: alert pushes need none, and recordings upload through a background
        # URLSession, which needs none either (App Review 2.5.4).
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [instagram, tiktok, snssdk1233]
        NSCameraUsageDescription: "DentVideo uses the camera when you record yourself with a filming card. Recordings are uploaded only when you choose \"Use this take\"."
        NSMicrophoneUsageDescription: "DentVideo records your voice with the video when you record yourself with a filming card."
        NSPhotoLibraryAddUsageDescription: "DentVideo saves your approved videos to Photos so you can post them on Instagram, TikTok and other apps."
        DVAPIBaseURL: $(DV_API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.bulsulabs.dentvideo
            CFBundleURLSchemes: [dentvideo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bulsulabs.dentvideo
        PRODUCT_NAME: DentVideo
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: "YA6Y85MSY6"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: DentVideoCore
    entitlements:
      path: App/DentVideo.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:dentvideo.com

  # Unit tests of the app target's models (AppModel, uploads, deep links), hosted in the app.
  DentVideoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Unit
    dependencies:
      - target: DentVideo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.bulsulabs.dentvideo.tests

  # End-to-end journeys against the in-process fake API (demo flow mode, DEBUG builds).
  DentVideoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UI
    dependencies:
      - target: DentVideo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.bulsulabs.dentvideo.uitests
        TEST_TARGET_NAME: DentVideo

schemes:
  DentVideo:
    build:
      targets:
        DentVideo: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [DentVideo]
      targets:
        - DentVideoTests
        - DentVideoUITests
    archive:
      config: Release
